[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pattom"
version = "0.1.0"
description = "Pattom signal-timing study: video to traffic parameters, emissions, MCE and SUMO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "PyYAML>=6.0",
    "scipy>=1.11",
]

[project.optional-dependencies]
# YOLO detection. Pulls in PyTorch; see README for the GPU build on Windows.
detect = [
    "ultralytics>=8.4.177",  # uses predict(quantize=...)
]
viewer = [
    "fastapi>=0.143.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "playwright>=1.64.0",
    "pytest>=8.0",
]

[project.scripts]
pattom = "pattom.cli:main"

[tool.uv]
# Keep uv's download cache inside the repository.
cache-dir = ".uv-cache"

[tool.hatch.build.targets.wheel]
packages = ["src/pattom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
