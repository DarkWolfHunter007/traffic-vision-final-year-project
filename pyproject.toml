[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "traffic-vision"
version = "0.1.0"
description = "Traceable offline traffic-video ingestion foundation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "av>=14.0",
    "fastapi>=0.115",
    "PyYAML>=6.0",
    "ultralytics>=8.3",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.0",
]

[project.scripts]
traffic-vision = "backend.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
