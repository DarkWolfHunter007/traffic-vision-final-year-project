[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "pattom"
version = "0.1.0"
description = "Pattom signal-timing study: video to traffic parameters, emissions, MCE and SUMO"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "PyYAML>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
pattom = "pattom.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pattom"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
