# Example full pipeline, video to congestion index. Copy and edit; paths are relative to the repo root.
# Stages read their own config files (configs/*.yaml) and stop on open decisions
# (O3 PCU table, O4 congestion weights, O6 stopped-speed threshold) until those files are approved.
nodes:
  cfr:         {type: cfr, params: {video: raw-video/IMG_1480.MOV, out: data/cfr/IMG_1480.mp4, slot: test}, pos: [20, 20]}
  detect:      {type: detect, params: {slot: test}, pos: [260, 20]}
  track:       {type: track, pos: [500, 20]}
  ground:      {type: ground, pos: [740, 20]}
  count:       {type: count, pos: [980, 20]}
  delay_queue: {type: delay_queue, pos: [980, 160]}
  emissions:   {type: emissions, pos: [1220, 160]}
  indicators:  {type: indicators, pos: [1220, 20]}
  congestion:  {type: congestion, pos: [1460, 20]}
edges:
  - {from: cfr.video, to: detect.video}
  - {from: detect.detections, to: track.detections}
  - {from: track.tracks, to: ground.tracks}
  - {from: ground.tracks, to: count.tracks}
  - {from: ground.tracks, to: delay_queue.tracks}
  - {from: delay_queue.delays, to: emissions.delays}
  - {from: count.counts, to: indicators.counts}
  - {from: delay_queue.delays, to: indicators.delays}
  - {from: indicators.indicators, to: congestion.indicators}
