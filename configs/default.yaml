paths:
  raw_root: data/raw
  processed_root: data/processed
  database_path: data/processed/traffic_vision.sqlite3
input:
  supported_formats:
    - .avi
    - .mkv
    - .mov
    - .mp4
timestamp:
  strategy: decoder_pts
  wall_clock_start: null
streaming:
  frame_batch_size: 500
  preview_frame_number: 0
resources:
  policy: cpu
  gpu_oom_behavior: not_applicable_phase_01
logging:
  level: INFO
detection:
  model:
    version: null
    path: null
    device: cpu
  confidence_threshold: 0.25
  iou_threshold: 0.45
  image_size: 640
  frame_stride: 1
  roi_crop: null
  tiling:
    enabled: false
    width: 640
    height: 640
    overlap: 0.2
  class_mapping: {}
tracking:
  tracker_type: bytetrack
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  match_thresh: 0.8
  track_buffer_seconds: 1.0
  fuse_score: true
  chunk_frames: 500
trajectories:
  ground_point_method: bottom_center
  max_gap_seconds: 1.0
  min_track_length_frames: 3
  boundary_margin_px: 20
visualization:
  enabled: true
  show_boxes: true
  show_labels: true
  show_confidences: true
  show_ids: true
  show_trails: true
  trail_length: 30
  trail_thickness: 2
  box_thickness: 2
  font_scale: 0.5
  output_dir: data/processed/visualizations
