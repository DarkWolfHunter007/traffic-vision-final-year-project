paths:
  raw_root: data/raw
  processed_root: data/processed
  database_path: data/processed/traffic_vision.sqlite3
input:
  supported_formats:
    - .avi
    - .mkv
    - .mov
    - .mp4
timestamp:
  strategy: decoder_pts
  wall_clock_start: null
streaming:
  frame_batch_size: 500
  preview_frame_number: 0
resources:
  policy: cpu
  gpu_oom_behavior: not_applicable_phase_01
logging:
  level: INFO
detection:
  model:
    version: null
    path: null
    device: cpu
  confidence_threshold: 0.25
  iou_threshold: 0.45
  image_size: 640
  frame_stride: 1
  roi_crop: null
  tiling:
    enabled: false
    width: 640
    height: 640
    overlap: 0.2
  class_mapping: {}
tracking:
  tracker_type: bytetrack
  track_high_thresh: 0.5
  track_low_thresh: 0.1
  new_track_thresh: 0.6
  match_thresh: 0.8
  track_buffer_seconds: 1.0
  fuse_score: true
  chunk_frames: 500
  batch_size: 500
trajectories:
  ground_point_method: bottom_center
  max_gap_seconds: 1.0
  min_track_length_frames: 3
  boundary_margin_px: 20
visualization:
  enabled: true
  show_boxes: true
  show_labels: true
  show_confidences: true
  show_ids: true
  show_trails: true
  trail_length: 30
  trail_thickness: 2
  box_thickness: 2
  font_scale: 0.5
  output_dir: data/processed/visualizations
counting:
  bin_duration_s: 900.0
  min_reentry_gap_s: 2.0
  error_tolerance_pct: 10.0
  movement_mapping:
    north:
      south: through
      east: left
      west: right
      north: u_turn
    south:
      north: through
      west: left
      east: right
      south: u_turn
    east:
      west: through
      north: right
      south: left
      east: u_turn
    west:
      east: through
      south: right
      north: left
      west: u_turn
calibration:
  method: planar_homography
  min_points: 6
  held_out_count: 2
  max_reprojection_error_m: 1.0
  distortion_check_enabled: false
  flat_road_assumption: true
  coordinate_unit: meter
speed:
  smoothing_method: moving_average
  smoothing_window_s: 0.5
  min_track_points: 3
  max_gap_seconds: 1.0
  min_displacement_m: 0.1
  max_plausible_speed_mps: 45.0
  ground_point_method: bottom_center

