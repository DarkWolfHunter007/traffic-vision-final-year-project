paths:
  raw_root: data/raw
  processed_root: data/processed
  database_path: data/processed/traffic_vision.sqlite3
input:
  supported_formats:
    - .avi
    - .mkv
    - .mov
    - .mp4
timestamp:
  strategy: decoder_pts
  wall_clock_start: null
streaming:
  frame_batch_size: 500
  preview_frame_number: 0
resources:
  policy: cpu
  gpu_oom_behavior: not_applicable_phase_01
logging:
  level: INFO
detection:
  model:
    version: null
    path: null
    device: cpu
  confidence_threshold: 0.25
  iou_threshold: 0.45
  image_size: 640
  frame_stride: 1
  roi_crop: null
  tiling:
    enabled: false
    width: 640
    height: 640
    overlap: 0.2
  class_mapping: {}
